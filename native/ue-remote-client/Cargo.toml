[package]
name = "ue-remote-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Independent localhost client for Unreal Python Remote Execution"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
