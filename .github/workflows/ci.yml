name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --group dev
      - run: cargo fmt --check --manifest-path native/ue-remote-client/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path native/ue-remote-client/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/ue-remote-client/Cargo.toml
      - run: uv run --locked python -m pytest -q
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: cargo about generate scripts/licenses.hbs --locked --fail --manifest-path native/ue-remote-client/Cargo.toml --output-file THIRD_PARTY_LICENSES.html
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.html
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native/ue-remote-client
